name: Bug report
description: Report a reproducible problem in agctx.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        보안 취약점은 공개 이슈가 아니라 SECURITY.md의 비공개 신고 절차를 사용해 주세요.
  - type: textarea
    id: summary
    attributes:
      label: 문제 요약
      description: 무엇이 예상과 다르게 동작했나요?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 명령어, 최소 입력, 예상 결과와 실제 결과를 적어 주세요.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: agctx version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 환경
      placeholder: Node.js 24, macOS 15, pnpm 10.15.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 로그 또는 추가 정보
      description: 비밀값과 개인정보를 제거한 출력만 붙여 주세요.
