name: Feature request
description: Suggest an improvement to Agentic.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 현재 어떤 사용자 문제나 제약이 있나요?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      description: 원하는 동작과 사용 예시를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 대안
      description: 다른 방법을 검토했다면 적어 주세요.
  - type: checkboxes
    id: scope
    attributes:
      label: 범위 확인
      options:
        - label: 이 제안은 Agentic의 공통 개발 지침 생성·설정·동기화·적용 방향과 관련 있습니다.
