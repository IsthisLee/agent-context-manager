<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" font-family="'Pretendard Variable', 'Pretendard', 'Inter', 'Helvetica Neue', Arial, sans-serif">
  <!-- Dark-theme variant of agctx-overview.en.svg with the same geometry; only colors differ. Keep both in sync. Render: rsvg-convert -z 2 agctx-overview.en.dark.svg -o agctx-overview.en.dark.png -->
  <!-- Git flow shows docs/discussion/architecture/topics/git-profile-management.md (Implemented, ADR 0017). -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9d1d9"/>
    </marker>
    <marker id="arrow-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a371f7"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1279" height="739" rx="20" fill="#0d1117" stroke="#30363d"/>

  <text x="40" y="60" font-size="22" font-weight="700" fill="#e6edf3">Apply purpose-specific Profiles to many projects, and multiple AI agents work from the same guidance</text>

  <!-- Column headers -->
  <text x="145" y="112" font-size="16" font-weight="700" fill="#9da7b3" text-anchor="middle">Git remote</text>
  <rect x="72" y="124" width="146" height="24" rx="12" fill="#1e1633" stroke="#a371f7"/>
  <text x="145" y="141" font-size="12" font-weight="700" fill="#a371f7" text-anchor="middle">clone · pull · push</text>
  <text x="445" y="112" font-size="16" font-weight="700" fill="#9da7b3" text-anchor="middle">Profiles</text>
  <text x="445" y="136" font-size="12" fill="#7d8590" text-anchor="middle">~/.agctx/profiles</text>
  <text x="795" y="112" font-size="16" font-weight="700" fill="#9da7b3" text-anchor="middle">Projects</text>
  <text x="1125" y="112" font-size="16" font-weight="700" fill="#9da7b3" text-anchor="middle">Generated files → reading agents</text>
  <text x="1125" y="136" font-size="12" fill="#7d8590" text-anchor="middle">Example: api-server</text>

  <!-- Git remote -->
  <rect x="40" y="250" width="210" height="150" rx="14" fill="#1a1430" stroke="#a371f7" stroke-width="2"/>
  <text x="145" y="294" font-size="15" font-weight="700" fill="#d2a8ff" text-anchor="middle">Team · org Profile repo</text>
  <text x="145" y="318" font-size="12" fill="#a371f7" text-anchor="middle">Standard Git: GitHub, GitLab, …</text>
  <text x="145" y="350" font-size="13" fill="#9da7b3" text-anchor="middle">The Profile owner pushes;</text>
  <text x="145" y="370" font-size="13" fill="#9da7b3" text-anchor="middle">members clone and pull</text>

  <rect x="40" y="450" width="210" height="76" rx="14" fill="#1a1430" stroke="#a371f7" stroke-width="1.5"/>
  <text x="145" y="480" font-size="15" font-weight="700" fill="#d2a8ff" text-anchor="middle">Member A · B</text>
  <text x="145" y="504" font-size="12" fill="#9da7b3" text-anchor="middle">Same Profile, their own projects</text>
  <path d="M145,400 L145,446" fill="none" stroke="#a371f7" stroke-width="2" marker-end="url(#arrow-plan)"/>
  <text x="155" y="428" font-size="12" fill="#a371f7">profile clone</text>
  <text x="145" y="560" font-size="12" fill="#a371f7" text-anchor="middle">profile pull updates only the Profile;</text>
  <text x="145" y="578" font-size="12" fill="#a371f7" text-anchor="middle">profile sync updates projects</text>

  <!-- Git ⇄ profiles -->
  <path d="M250,300 C292,300 290,370 326,370" fill="none" stroke="#a371f7" stroke-width="2" marker-start="url(#arrow-plan)" marker-end="url(#arrow-plan)"/>
  <path d="M250,370 C292,370 290,530 326,530" fill="none" stroke="#a371f7" stroke-width="2" marker-start="url(#arrow-plan)" marker-end="url(#arrow-plan)"/>
  <text x="256" y="284" font-size="12" font-weight="600" fill="#a371f7">clone · pull ⇄ push</text>

  <!-- Profiles -->
  <g>
    <rect x="330" y="170" width="230" height="96" rx="14" fill="#0f2a1a" stroke="#238636"/>
    <rect x="330" y="170" width="7" height="96" rx="3" fill="#3fb950"/>
    <text x="355" y="208" font-size="20" font-weight="700" fill="#7ee787">Personal</text>
    <text x="355" y="236" font-size="13" fill="#9da7b3">AGENTS.md · personal guidance</text>
  </g>
  <g>
    <rect x="330" y="330" width="230" height="96" rx="14" fill="#0c1d33" stroke="#1f6feb"/>
    <rect x="330" y="330" width="7" height="96" rx="3" fill="#58a6ff"/>
    <text x="355" y="368" font-size="20" font-weight="700" fill="#79c0ff">Company</text>
    <text x="355" y="396" font-size="13" fill="#9da7b3">AGENTS.md · company guidance</text>
  </g>
  <g>
    <rect x="330" y="490" width="230" height="96" rx="14" fill="#2b1d07" stroke="#9e6a03"/>
    <rect x="330" y="490" width="7" height="96" rx="3" fill="#d29922"/>
    <text x="355" y="528" font-size="20" font-weight="700" fill="#e3b341">Team</text>
    <text x="355" y="556" font-size="13" fill="#9da7b3">AGENTS.md · team guidance</text>
  </g>

  <!-- Profiles → projects (available) -->
  <text x="615" y="150" font-size="13" font-weight="600" fill="#c9d1d9" text-anchor="middle">apply · sync</text>
  <path d="M560,208 C615,208 615,191 666,191" fill="none" stroke="#c9d1d9" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M560,228 C615,228 615,267 666,267" fill="none" stroke="#c9d1d9" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M560,368 C615,368 615,361 666,361" fill="none" stroke="#c9d1d9" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M560,388 C615,388 615,437 666,437" fill="none" stroke="#c9d1d9" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M560,538 C615,538 615,531 666,531" fill="none" stroke="#c9d1d9" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Projects -->
  <g>
    <rect x="670" y="160" width="250" height="62" rx="12" fill="#161b22" stroke="#30363d"/>
    <rect x="670" y="160" width="6" height="62" rx="3" fill="#3fb950"/>
    <text x="692" y="186" font-size="17" font-weight="700" fill="#e6edf3">blog</text>
    <text x="692" y="208" font-size="12" fill="#8b949e">Personal Profile + domain rules</text>
  </g>
  <g>
    <rect x="670" y="236" width="250" height="62" rx="12" fill="#161b22" stroke="#30363d"/>
    <rect x="670" y="236" width="6" height="62" rx="3" fill="#3fb950"/>
    <text x="692" y="262" font-size="17" font-weight="700" fill="#e6edf3">side-project</text>
    <text x="692" y="284" font-size="12" fill="#8b949e">Personal Profile + domain rules</text>
  </g>
  <g>
    <rect x="670" y="330" width="250" height="62" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <rect x="670" y="330" width="6" height="62" rx="3" fill="#58a6ff"/>
    <text x="692" y="356" font-size="17" font-weight="700" fill="#e6edf3">api-server</text>
    <text x="692" y="378" font-size="12" fill="#8b949e">Company Profile + domain rules</text>
  </g>
  <g>
    <rect x="670" y="406" width="250" height="62" rx="12" fill="#161b22" stroke="#30363d"/>
    <rect x="670" y="406" width="6" height="62" rx="3" fill="#58a6ff"/>
    <text x="692" y="432" font-size="17" font-weight="700" fill="#e6edf3">web-app</text>
    <text x="692" y="454" font-size="12" fill="#8b949e">Company Profile + domain rules</text>
  </g>
  <g>
    <rect x="670" y="500" width="250" height="62" rx="12" fill="#161b22" stroke="#30363d"/>
    <rect x="670" y="500" width="6" height="62" rx="3" fill="#d29922"/>
    <text x="692" y="526" font-size="17" font-weight="700" fill="#e6edf3">mobile-app</text>
    <text x="692" y="548" font-size="12" fill="#8b949e">Team Profile + domain rules</text>
  </g>
  <text x="795" y="604" font-size="12" fill="#8b949e" text-anchor="middle">Every project's domain rules stay in the AGENTS.md</text>
  <text x="795" y="622" font-size="12" fill="#8b949e" text-anchor="middle">extension section and survive apply and sync</text>

  <!-- api-server → its own generated files (every project gets its own set) -->
  <path d="M920,361 L996,361" fill="none" stroke="#c9d1d9" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="958" y="348" font-size="11" fill="#c9d1d9" text-anchor="middle">generate</text>
  <text x="1125" y="432" font-size="12" fill="#8b949e" text-anchor="middle">Every project gets its own set</text>
  <text x="1125" y="450" font-size="12" fill="#8b949e" text-anchor="middle">with the same layout</text>

  <!-- Agent files -->
  <rect x="1000" y="166" width="250" height="236" rx="14" fill="#0d1117" stroke="#30363d"/>
  <g font-size="15" font-weight="700" fill="#e6edf3">
    <rect x="1014" y="182" width="222" height="60" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="1028" y="206" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="400" fill="#8b949e">AGENTS.md</text>
    <text x="1028" y="230">Codex and others</text>
    <rect x="1014" y="254" width="222" height="60" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="1028" y="278" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="400" fill="#8b949e">CLAUDE.md</text>
    <text x="1028" y="302">Claude Code</text>
    <rect x="1014" y="326" width="222" height="60" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="1028" y="350" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="400" fill="#8b949e">.agents/rules/agctx.md</text>
    <text x="1028" y="374">Antigravity</text>
  </g>

  <!-- Legend -->
  <path d="M40,694 L96,694" stroke="#c9d1d9" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="108" y="699" font-size="13" fill="#c9d1d9">Apply and sync</text>
  <path d="M230,694 L286,694" stroke="#a371f7" stroke-width="2" marker-end="url(#arrow-plan)"/>
  <text x="298" y="699" font-size="13" fill="#a371f7">Git sharing (clone · pull · push)</text>
</svg>
