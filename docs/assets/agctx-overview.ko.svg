<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" font-family="'Pretendard Variable', 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <!-- Source for agctx-overview.ko.png. Render: rsvg-convert -z 2 agctx-overview.ko.svg -o agctx-overview.ko.png -->
  <!-- Git flow follows docs/discussion/architecture/topics/git-profile-management.md (Proposed). Remove the planned styling once it ships. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1279" height="739" rx="20" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="40" y="60" font-size="22" font-weight="700" fill="#0f172a">용도별 프로필을 여러 프로젝트에 적용하면, 여러 AI 에이전트가 같은 지침으로 작업합니다</text>

  <!-- Column headers -->
  <text x="145" y="112" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">Git 원격</text>
  <rect x="100" y="124" width="90" height="24" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-dasharray="4 3"/>
  <text x="145" y="141" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">구현 예정</text>
  <text x="445" y="112" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">프로필</text>
  <text x="445" y="136" font-size="12" fill="#94a3b8" text-anchor="middle">~/.agctx/profiles</text>
  <text x="795" y="112" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">프로젝트</text>
  <text x="1125" y="112" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">생성 파일 → 읽는 에이전트</text>
  <text x="1125" y="136" font-size="12" fill="#94a3b8" text-anchor="middle">api-server 예시</text>

  <!-- Git remote (planned) -->
  <rect x="40" y="250" width="210" height="150" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="145" y="294" font-size="17" font-weight="700" fill="#4c1d95" text-anchor="middle">팀·조직 프로필 저장소</text>
  <text x="145" y="318" font-size="12" fill="#7c3aed" text-anchor="middle">GitHub · GitLab 등 표준 Git 원격</text>
  <text x="145" y="350" font-size="13" fill="#475569" text-anchor="middle">프로필 관리자가 push하고</text>
  <text x="145" y="370" font-size="13" fill="#475569" text-anchor="middle">구성원이 clone · pull합니다</text>

  <rect x="40" y="450" width="210" height="76" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="145" y="480" font-size="15" font-weight="700" fill="#4c1d95" text-anchor="middle">구성원 A · B</text>
  <text x="145" y="504" font-size="12" fill="#475569" text-anchor="middle">같은 프로필을 각자 프로젝트에 적용</text>
  <path d="M145,400 L145,446" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-plan)"/>
  <text x="155" y="428" font-size="12" fill="#7c3aed">profile clone</text>
  <text x="145" y="560" font-size="12" fill="#7c3aed" text-anchor="middle">profile pull은 프로필만 갱신하고</text>
  <text x="145" y="578" font-size="12" fill="#7c3aed" text-anchor="middle">프로젝트 반영은 profile sync로 합니다</text>

  <!-- Git ⇄ profiles (planned) -->
  <path d="M250,300 C292,300 290,370 326,370" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#arrow-plan)" marker-end="url(#arrow-plan)"/>
  <path d="M250,370 C292,370 290,530 326,530" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#arrow-plan)" marker-end="url(#arrow-plan)"/>
  <text x="256" y="284" font-size="12" font-weight="600" fill="#7c3aed">clone · pull ⇄ push</text>

  <!-- Profiles -->
  <g>
    <rect x="330" y="170" width="230" height="96" rx="14" fill="#f0fdf4" stroke="#bbf7d0"/>
    <rect x="330" y="170" width="7" height="96" rx="3" fill="#16a34a"/>
    <text x="355" y="208" font-size="20" font-weight="700" fill="#14532d">Personal</text>
    <text x="355" y="236" font-size="13" fill="#475569">AGENTS.md · 개인 공통 지침</text>
  </g>
  <g>
    <rect x="330" y="330" width="230" height="96" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
    <rect x="330" y="330" width="7" height="96" rx="3" fill="#2563eb"/>
    <text x="355" y="368" font-size="20" font-weight="700" fill="#1e3a8a">Company</text>
    <text x="355" y="396" font-size="13" fill="#475569">AGENTS.md · 회사 공통 지침</text>
  </g>
  <g>
    <rect x="330" y="490" width="230" height="96" rx="14" fill="#fffbeb" stroke="#fde68a"/>
    <rect x="330" y="490" width="7" height="96" rx="3" fill="#d97706"/>
    <text x="355" y="528" font-size="20" font-weight="700" fill="#78350f">Team</text>
    <text x="355" y="556" font-size="13" fill="#475569">AGENTS.md · 팀 공통 지침</text>
  </g>

  <!-- Profiles → projects (available) -->
  <text x="615" y="150" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">apply · sync</text>
  <path d="M560,208 C615,208 615,191 666,191" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M560,228 C615,228 615,267 666,267" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M560,368 C615,368 615,361 666,361" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M560,388 C615,388 615,437 666,437" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M560,538 C615,538 615,531 666,531" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Projects -->
  <g>
    <rect x="670" y="160" width="250" height="62" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="670" y="160" width="6" height="62" rx="3" fill="#16a34a"/>
    <text x="692" y="186" font-size="17" font-weight="700" fill="#0f172a">blog</text>
    <text x="692" y="208" font-size="12" fill="#64748b">Personal 프로필 + 도메인 규칙</text>
  </g>
  <g>
    <rect x="670" y="236" width="250" height="62" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="670" y="236" width="6" height="62" rx="3" fill="#16a34a"/>
    <text x="692" y="262" font-size="17" font-weight="700" fill="#0f172a">side-project</text>
    <text x="692" y="284" font-size="12" fill="#64748b">Personal 프로필 + 도메인 규칙</text>
  </g>
  <g>
    <rect x="670" y="330" width="250" height="62" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect x="670" y="330" width="6" height="62" rx="3" fill="#2563eb"/>
    <text x="692" y="356" font-size="17" font-weight="700" fill="#0f172a">api-server</text>
    <text x="692" y="378" font-size="12" fill="#64748b">Company 프로필 + 도메인 규칙</text>
  </g>
  <g>
    <rect x="670" y="406" width="250" height="62" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="670" y="406" width="6" height="62" rx="3" fill="#2563eb"/>
    <text x="692" y="432" font-size="17" font-weight="700" fill="#0f172a">web-app</text>
    <text x="692" y="454" font-size="12" fill="#64748b">Company 프로필 + 도메인 규칙</text>
  </g>
  <g>
    <rect x="670" y="500" width="250" height="62" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="670" y="500" width="6" height="62" rx="3" fill="#d97706"/>
    <text x="692" y="526" font-size="17" font-weight="700" fill="#0f172a">mobile-app</text>
    <text x="692" y="548" font-size="12" fill="#64748b">Team 프로필 + 도메인 규칙</text>
  </g>
  <text x="795" y="604" font-size="12" fill="#64748b" text-anchor="middle">모든 프로젝트의 도메인 규칙은 AGENTS.md 확장 섹션에 남고</text>
  <text x="795" y="622" font-size="12" fill="#64748b" text-anchor="middle">apply · sync 때에도 보존됩니다</text>

  <!-- api-server → its own generated files (every project gets its own set) -->
  <path d="M920,361 L996,361" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="958" y="348" font-size="11" fill="#334155" text-anchor="middle">생성</text>
  <text x="1125" y="432" font-size="12" fill="#64748b" text-anchor="middle">모든 프로젝트에 같은 구성으로</text>
  <text x="1125" y="450" font-size="12" fill="#64748b" text-anchor="middle">한 벌씩 생성됩니다</text>

  <!-- Agent files -->
  <rect x="1000" y="166" width="250" height="236" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <g font-size="15" font-weight="700" fill="#0f172a">
    <rect x="1014" y="182" width="222" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="1028" y="206" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="400" fill="#64748b">AGENTS.md</text>
    <text x="1028" y="230">Codex 등</text>
    <rect x="1014" y="254" width="222" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="1028" y="278" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="400" fill="#64748b">CLAUDE.md</text>
    <text x="1028" y="302">Claude Code</text>
    <rect x="1014" y="326" width="222" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="1028" y="350" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="400" fill="#64748b">.agents/rules/agctx.md</text>
    <text x="1028" y="374">Antigravity</text>
  </g>

  <!-- Legend -->
  <path d="M40,694 L96,694" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="108" y="699" font-size="13" fill="#334155">현재 제공</text>
  <path d="M210,694 L266,694" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-plan)"/>
  <text x="278" y="699" font-size="13" fill="#7c3aed">구현 예정 (Git 공유)</text>
</svg>
