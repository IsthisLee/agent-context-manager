    <text x="692" y="548" font-size="12" fill="#64748b">Team Profile + domain rules</text>
  </g>
  <text x="795" y="604" font-size="12" fill="#64748b" text-anchor="middle">Every project's domain rules stay in the AGENTS.md</text>
  <text x="795" y="622" font-size="12" fill="#64748b" text-anchor="middle">extension section and survive apply and sync</text>

