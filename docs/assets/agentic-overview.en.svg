<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" font-family="'Pretendard Variable', 'Pretendard', 'Inter', 'Helvetica Neue', Arial, sans-serif">
  <!-- Source for agentic-overview.en.png. Render: rsvg-convert -z 2 agentic-overview.en.svg -o agentic-overview.en.png -->
  <!-- Git flow follows docs/discussion/architecture/topics/git-profile-management.md (Proposed). Remove the planned styling once it ships. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
