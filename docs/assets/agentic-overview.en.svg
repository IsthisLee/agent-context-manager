  </defs>

  <rect x="0.5" y="0.5" width="1279" height="739" rx="20" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="40" y="60" font-size="22" font-weight="700" fill="#0f172a">Apply purpose-specific Profiles to many projects, and multiple AI agents work from the same guidance</text>

  <!-- Column headers -->
  <text x="145" y="112" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">Git remote</text>
  <rect x="100" y="124" width="90" height="24" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-dasharray="4 3"/>
  <text x="145" y="141" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">Planned</text>
  <text x="445" y="112" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">Profiles</text>
  <text x="445" y="136" font-size="12" fill="#94a3b8" text-anchor="middle">~/.agentic/profiles</text>
  <text x="795" y="112" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">Projects</text>
  <text x="1125" y="112" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">Agent files → agents</text>

  <!-- Git remote (planned) -->
  <rect x="40" y="250" width="210" height="150" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="145" y="294" font-size="15" font-weight="700" fill="#4c1d95" text-anchor="middle">Team · org Profile repo</text>
  <text x="145" y="318" font-size="12" fill="#7c3aed" text-anchor="middle">Standard Git: GitHub, GitLab, …</text>
  <text x="145" y="350" font-size="13" fill="#475569" text-anchor="middle">The Profile owner pushes;</text>
  <text x="145" y="370" font-size="13" fill="#475569" text-anchor="middle">members clone and pull</text>

  <rect x="40" y="450" width="210" height="76" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="145" y="480" font-size="15" font-weight="700" fill="#4c1d95" text-anchor="middle">Member A · B</text>
  <text x="145" y="504" font-size="12" fill="#475569" text-anchor="middle">Same Profile, their own projects</text>
  <path d="M145,400 L145,446" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-plan)"/>
  <text x="155" y="428" font-size="12" fill="#7c3aed">profile clone</text>
  <text x="145" y="560" font-size="12" fill="#7c3aed" text-anchor="middle">profile pull updates only the Profile;</text>
  <text x="145" y="578" font-size="12" fill="#7c3aed" text-anchor="middle">profile sync updates projects</text>

  <!-- Git ⇄ profiles (planned) -->
  <path d="M250,300 C292,300 290,370 326,370" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#arrow-plan)" marker-end="url(#arrow-plan)"/>
  <path d="M250,370 C292,370 290,530 326,530" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#arrow-plan)" marker-end="url(#arrow-plan)"/>
  <text x="256" y="284" font-size="12" font-weight="600" fill="#7c3aed">clone · pull ⇄ push</text>

