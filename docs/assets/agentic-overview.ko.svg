<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" font-family="'Pretendard Variable', 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <!-- Source for agentic-overview.ko.png. Render: rsvg-convert -z 2 agentic-overview.ko.svg -o agentic-overview.ko.png -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1279" height="699" rx="20" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="40" y="60" font-size="22" font-weight="700" fill="#0f172a">용도별 프로필을 여러 프로젝트에 적용하면, 모든 AI 에이전트가 같은 지침으로 작업합니다</text>

  <!-- Column headers -->
  <text x="145" y="112" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">Git 저장소</text>
  <rect x="100" y="124" width="90" height="24" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-dasharray="4 3"/>
  <text x="145" y="141" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">구현 예정</text>
  <text x="445" y="112" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">프로필</text>
  <text x="445" y="136" font-size="12" fill="#94a3b8" text-anchor="middle">~/.agentic-profiles</text>
  <text x="795" y="112" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">프로젝트</text>
  <text x="1125" y="112" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">에이전트별 파일 → 에이전트</text>

  <!-- Git (planned) -->
  <rect x="40" y="250" width="210" height="150" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="145" y="296" font-size="17" font-weight="700" fill="#4c1d95" text-anchor="middle">조직·팀 지침 저장소</text>
  <text x="145" y="320" font-size="12" fill="#7c3aed" text-anchor="middle">GitHub · GitLab 등</text>
  <text x="145" y="352" font-size="13" fill="#475569" text-anchor="middle">팀원 모두 같은 저장소를</text>
  <text x="145" y="372" font-size="13" fill="#475569" text-anchor="middle">clone · pull로 받습니다</text>

  <rect x="40" y="450" width="210" height="76" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="145" y="480" font-size="15" font-weight="700" fill="#4c1d95" text-anchor="middle">팀원 A · 팀원 B</text>
  <text x="145" y="504" font-size="12" fill="#475569" text-anchor="middle">같은 프로필을 각자 프로젝트에 적용</text>
  <path d="M145,400 L145,446" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-plan)"/>
  <text x="155" y="428" font-size="12" fill="#7c3aed">clone</text>

  <!-- Git ↔ profiles (planned) -->
  <path d="M250,300 C292,300 290,340 326,340" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#arrow-plan)" marker-end="url(#arrow-plan)"/>
  <path d="M250,370 C292,370 290,470 326,470" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#arrow-plan)" marker-end="url(#arrow-plan)"/>
  <text x="258" y="286" font-size="12" font-weight="600" fill="#7c3aed">pull ↔ push</text>

  <!-- Profiles -->
  <g>
    <rect x="330" y="170" width="230" height="96" rx="14" fill="#f0fdf4" stroke="#bbf7d0"/>
    <rect x="330" y="170" width="7" height="96" rx="3" fill="#16a34a"/>
    <text x="355" y="208" font-size="20" font-weight="700" fill="#14532d">Personal</text>
    <text x="355" y="236" font-size="13" fill="#475569">AGENTS.md · 개인 공통 지침</text>
  </g>
  <g>
    <rect x="330" y="300" width="230" height="96" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
    <rect x="330" y="300" width="7" height="96" rx="3" fill="#2563eb"/>
    <text x="355" y="338" font-size="20" font-weight="700" fill="#1e3a8a">Company</text>
    <text x="355" y="366" font-size="13" fill="#475569">AGENTS.md · 회사 공통 지침</text>
  </g>
  <g>
    <rect x="330" y="430" width="230" height="96" rx="14" fill="#fffbeb" stroke="#fde68a"/>
    <rect x="330" y="430" width="7" height="96" rx="3" fill="#d97706"/>
    <text x="355" y="468" font-size="20" font-weight="700" fill="#78350f">Team</text>
    <text x="355" y="496" font-size="13" fill="#475569">AGENTS.md · 팀 공통 지침</text>
  </g>

  <!-- Profiles → projects (available) -->
  <text x="615" y="156" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">apply · sync</text>
  <path d="M560,218 C615,218 615,208 666,208" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M560,340 C615,340 615,313 666,313" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M560,356 C615,356 615,403 666,403" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M560,478 C615,478 615,503 666,503" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Projects -->
  <g>
    <rect x="670" y="175" width="250" height="66" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="670" y="175" width="6" height="66" rx="3" fill="#16a34a"/>
    <text x="692" y="203" font-size="17" font-weight="700" fill="#0f172a">side-project</text>
    <text x="692" y="226" font-size="12" fill="#64748b">Personal 프로필</text>
  </g>
  <g>
    <rect x="670" y="280" width="250" height="66" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="670" y="280" width="6" height="66" rx="3" fill="#2563eb"/>
    <text x="692" y="308" font-size="17" font-weight="700" fill="#0f172a">api-server</text>
    <text x="692" y="331" font-size="12" fill="#64748b">Company 프로필 · 도메인 규칙 보존</text>
  </g>
  <g>
    <rect x="670" y="370" width="250" height="66" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="670" y="370" width="6" height="66" rx="3" fill="#2563eb"/>
    <text x="692" y="398" font-size="17" font-weight="700" fill="#0f172a">web-app</text>
    <text x="692" y="421" font-size="12" fill="#64748b">Company 프로필 · 도메인 규칙 보존</text>
  </g>
  <g>
    <rect x="670" y="470" width="250" height="66" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="670" y="470" width="6" height="66" rx="3" fill="#d97706"/>
    <text x="692" y="498" font-size="17" font-weight="700" fill="#0f172a">mobile-app</text>
    <text x="692" y="521" font-size="12" fill="#64748b">Team 프로필</text>
  </g>
  <text x="795" y="572" font-size="12" fill="#64748b" text-anchor="middle">프로젝트 도메인 규칙은 AGENTS.md 확장 섹션에 남고</text>
  <text x="795" y="590" font-size="12" fill="#64748b" text-anchor="middle">sync 때에도 보존됩니다</text>

  <!-- Projects → agent files -->
  <path d="M920,208 L936,208 M920,313 L936,313 M920,403 L936,403 M920,503 L936,503 M936,208 L936,503" fill="none" stroke="#334155" stroke-width="2.2"/>
  <path d="M936,355 L996,355" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="966" y="342" font-size="11" fill="#334155" text-anchor="middle">생성</text>

  <!-- Agent files -->
  <rect x="1000" y="160" width="250" height="390" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <g font-size="15" font-weight="700" fill="#0f172a">
    <rect x="1014" y="176" width="222" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="1028" y="200" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="400" fill="#64748b">AGENTS.md</text>
    <text x="1028" y="224">Codex 등</text>
    <rect x="1014" y="248" width="222" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="1028" y="272" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="400" fill="#64748b">CLAUDE.md</text>
    <text x="1028" y="296">Claude Code</text>
    <rect x="1014" y="320" width="222" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="1028" y="344" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="400" fill="#64748b">.agents/rules/agentic.md</text>
    <text x="1028" y="368">Antigravity</text>
    <rect x="1014" y="392" width="222" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="1028" y="416" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="400" fill="#64748b">.cursor/rules/agentic.mdc</text>
    <text x="1028" y="440">Cursor</text>
    <rect x="1014" y="464" width="222" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="1028" y="488" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" font-weight="400" fill="#64748b">.github/copilot-instructions.md</text>
    <text x="1028" y="512">GitHub Copilot</text>
  </g>

  <!-- Legend -->
  <path d="M40,650 L96,650" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="108" y="655" font-size="13" fill="#334155">현재 제공</text>
  <path d="M210,650 L266,650" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-plan)"/>
  <text x="278" y="655" font-size="13" fill="#7c3aed">구현 예정 (Git 공유)</text>
</svg>
